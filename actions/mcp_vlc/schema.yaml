actions:
  vlc:
    signature: vlc <action> [<enable>] [<field>] [<path>] [<suffix>] [<uri>] [<value>]
    docstring: |-
      Entry point for VLC MCP tools. Choose a sub-action and supply its parameters.

      Available actions:
      - add_to_playlist: Adds a media file to the VLC playlist. (required: uri)
      - get_current_time: Gets the current playback time position of the playing media in seconds.
      - get_media_duration: Gets the total duration of the currently playing media file in seconds.
      - get_media_files: Gets the media files for the specified path. (required: path; optional: suffix)
      - get_playlist: Gets the current VLC playlist with track information including name, URI and duration.
      - get_settings: Gets the current settings of the VLC player.
      - next: Switches to the next media item in the VLC playlist.
      - pause: Pauses the currently playing media in VLC player.
      - play: Starts playing the current media in VLC player.
      - previous: Switches to the previous media item in the VLC playlist.
      - set_settings: Sets the settings for the VLC player. (required: field, value)
      - toggle_fullscreen: Toggles fullscreen mode for the currently playing video in the media player. If the video is not in fullscreen mode, it will be expanded to fill the entire screen. If it's already in fullscreen mode, it will return to windowed mode. (optional: enable)
    arguments:
    - name: action
      type: string
      description: 'Sub-action to run. Allowed options: add_to_playlist, get_current_time, get_media_duration, get_media_files,
        get_playlist, get_settings, next, pause, play, previous, set_settings, toggle_fullscreen.'
      required: true
      enum:
      - add_to_playlist
      - get_current_time
      - get_media_duration
      - get_media_files
      - get_playlist
      - get_settings
      - next
      - pause
      - play
      - previous
      - set_settings
      - toggle_fullscreen
    - name: enable
      type: boolean
      description: Optional parameter to explicitly set fullscreen mode. If true, forces fullscreen mode. If false, exits
        fullscreen mode. If not provided, the current state is toggled.
      required: false
      argument_format: --enable {{value}}
    - name: field
      type: string
      description: 'The name of the setting to set. i.e. input-record-path: the path to the recording folder, qt-bgcone: disable/enable
        splash cone icon (in 0/1), qt-max-volume: set max volume (in number), qt-minimal-view: hide/show bottom toolbar (in
        0/1), global-key-play-pause: disable/enable play&pause key (in 0/1)'
      required: false
      argument_format: --field {{value}}
    - name: path
      type: string
      description: The path to the media files
      required: false
      argument_format: --path {{value}}
    - name: suffix
      type: array
      description: The suffix of the media files, default is ['mp4', 'avi', 'mkv', 'mov', 'mp3', 'm4a', 'wav']
      required: false
      argument_format: --suffix "{{value}}"
    - name: uri
      type: string
      description: The URI of the media file to add to the playlist, start with 'file://' or 'https://'
      required: false
      argument_format: --uri {{value}}
    - name: value
      type: string
      description: The value to set for the specified setting, set 0/1 for boolean values
      required: false
      argument_format: --value {{value}}
    meta:
      related_app: vlc
