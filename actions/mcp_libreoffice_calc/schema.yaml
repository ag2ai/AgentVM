actions:
  libreoffice_calc:
    signature: libreoffice_calc <action> [<aggregation_function>] [<alignment>] [<ascending>] [<autofit>] [<background_color>]
      [<bold>] [<cell>] [<chart_type>] [<col_fields>] [<color>] [<column_name>] [<column_order>] [<columns>] [<data>] [<data_range>]
      [<decimal_places>] [<file_path>] [<font_color>] [<format_type>] [<height>] [<new_name>] [<new_sheet_name>] [<old_name>]
      [<open_after_export>] [<position>] [<range_str>] [<row_fields>] [<rows>] [<sheet_name>] [<sheets>] [<source_range>]
      [<source_sheet>] [<start_index>] [<table_name>] [<target_cell>] [<title>] [<value>] [<value_fields>] [<width>] [<x_axis_title>]
      [<y_axis_title>] [<zoom_percentage>]
    docstring: |-
      Unified entry point for libreoffice_calc MCP tools. Choose a sub-action and supply its parameters.

      Available actions:
      - adjust_column_width: Adjust the width of specified columns. (required: columns; optional: width, autofit)
      - adjust_row_height: Adjust the height of specified rows. (required: rows; optional: height, autofit)
      - copy_sheet: Create a copy of an existing worksheet in the workbook. (required: source_sheet; optional: new_sheet_name)
      - create_chart: Create a chart in the active worksheet based on the specified data range. (required: chart_type, data_range; optional: title, x_axis_title, y_axis_title)
      - create_pivot_table: Create a pivot table in the active worksheet based on data from the source sheet. (required: source_sheet, table_name, value_fields; optional: row_fields, col_fields, aggregation_function, target_cell)
      - env_info: Get content of the specified or active sheet, including its name, headers, and data. It should be called first to obtain the information before other tools that depend on the results are invoked. (optional: sheet_name)
      - export_to_csv: Export the current document to a CSV file with the same path and name as the original file.
      - export_to_pdf: Export the current document or specified sheets to PDF. (optional: file_path, sheets, open_after_export)
      - format_range: Apply formatting to the specified range in the active worksheet. (required: range_str; optional: background_color, font_color, bold, alignment)
      - freeze_panes: Freeze rows and/or columns in the active worksheet. (optional: rows, columns)
      - get_column_data: Get all data from the specified column. (required: column_name)
      - get_workbook_info: Get workbook information, including file path, file name, sheets and active sheet.
      - hide_row_data: Hide rows that contain the specified value. (optional: value)
      - highlight_range: Highlight the specified range with the specified color. (required: range_str; optional: color)
      - merge_cells: Merge cells in the specified range. (required: range_str)
      - rename_sheet: Rename a worksheet in the workbook. (required: old_name, new_name)
      - reorder_columns: Reorder the columns in the sheet according to the specified order. (required: column_order)
      - reorder_sheets: Change the order of worksheets in the workbook. (required: sheet_name, position)
      - save: Save the current workbook to its current location
      - set_cell_value: Set a value to a specific cell in the active worksheet. (required: cell, value)
      - set_column_values: Set values to the specified column, cannot be used to set formulas. (required: column_name, data; optional: start_index)
      - set_number_format: Apply a specific number format to a range of cells. (required: range_str, format_type; optional: decimal_places)
      - set_zoom_level: Adjust the zoom level of the current worksheet. (required: zoom_percentage)
      - sort_column: Sort the data in the specified column in ascending or descending order. (required: column_name; optional: ascending, start_index)
      - switch_active_sheet: Switch to the specified sheet and make it active. Creates new sheet if it doesn't exist. (required: sheet_name)
      - transpose_range: Transpose the specified range and paste it to the target cell. (required: source_range, target_cell)
    arguments:
    - name: action
      type: string
      description: 'Sub-action to run. Allowed options: adjust_column_width, adjust_row_height, copy_sheet, create_chart,
        create_pivot_table, env_info, export_to_csv, export_to_pdf, format_range, freeze_panes, get_column_data, get_workbook_info,
        hide_row_data, highlight_range, merge_cells, rename_sheet, reorder_columns, reorder_sheets, save, set_cell_value,
        set_column_values, set_number_format, set_zoom_level, sort_column, switch_active_sheet, transpose_range.'
      required: true
      enum:
      - adjust_column_width
      - adjust_row_height
      - copy_sheet
      - create_chart
      - create_pivot_table
      - env_info
      - export_to_csv
      - export_to_pdf
      - format_range
      - freeze_panes
      - get_column_data
      - get_workbook_info
      - hide_row_data
      - highlight_range
      - merge_cells
      - rename_sheet
      - reorder_columns
      - reorder_sheets
      - save
      - set_cell_value
      - set_column_values
      - set_number_format
      - set_zoom_level
      - sort_column
      - switch_active_sheet
      - transpose_range
    - name: aggregation_function
      type: string
      description: Aggregation function to use (sum, count, average, min, max), default is 'sum'
      required: false
      argument_format: --aggregation_function {{value}}
    - name: alignment
      type: string
      description: Text alignment (left, center, right)
      required: false
      argument_format: --alignment {{value}}
    - name: ascending
      type: boolean
      description: Whether to sort in ascending order (default True)
      required: false
      argument_format: --ascending {{value}}
    - name: autofit
      type: boolean
      description: Whether to autofit columns to content
      required: false
      argument_format: --autofit {{value}}
    - name: background_color
      type: string
      description: Background color in hex format (e.g., '#0000ff')
      required: false
      argument_format: --background_color {{value}}
    - name: bold
      type: boolean
      description: Whether to make the text bold
      required: false
      argument_format: --bold {{value}}
    - name: cell
      type: string
      description: Cell reference (e.g., 'A1')
      required: false
      argument_format: --cell {{value}}
    - name: chart_type
      type: string
      description: Type of chart (bar, column, line, pie, scatter, area)
      required: false
      argument_format: --chart_type {{value}}
    - name: col_fields
      type: array
      description: List of fields to use as column labels (e.g. ['A', 'B', 'C'])
      required: false
      argument_format: --col_fields "{{value}}"
    - name: color
      type: integer
      description: Color to highlight with, default is 0xFF0000 (red)
      required: false
      argument_format: --color {{value}}
    - name: column_name
      type: string
      description: Name of the column to read (e.g. 'A', 'B', etc.)
      required: false
      argument_format: --column_name {{value}}
    - name: column_order
      type: array
      description: A list of column names in the desired order (e.g. ['A', 'B', 'C'])
      required: false
      argument_format: --column_order "{{value}}"
    - name: columns
      type: integer
      description: Number of columns to freeze from the left
      required: false
      argument_format: --columns {{value}}
    - name: data
      type: array
      description: List of values to write to the column
      required: false
      argument_format: --data "{{value}}"
    - name: data_range
      type: string
      description: Range containing the data for the chart, in the format of 'A1:B10'
      required: false
      argument_format: --data_range {{value}}
    - name: decimal_places
      type: integer
      description: Number of decimal places to display (optional)
      required: false
      argument_format: --decimal_places {{value}}
    - name: file_path
      type: string
      description: Path where to save the PDF file, default is the same path as the original file
      required: false
      argument_format: --file_path {{value}}
    - name: font_color
      type: string
      description: Font color in hex format (e.g., '#ffffff')
      required: false
      argument_format: --font_color {{value}}
    - name: format_type
      type: string
      description: Type of number format (general, number, currency, accounting, date, time, percentage, fraction, scientific,
        text)
      required: false
      argument_format: --format_type {{value}}
    - name: height
      type: number
      description: Height to set (in points)
      required: false
      argument_format: --height {{value}}
    - name: new_name
      type: string
      description: New name for the worksheet
      required: false
      argument_format: --new_name {{value}}
    - name: new_sheet_name
      type: string
      description: Name for the new worksheet copy (optional)
      required: false
      argument_format: --new_sheet_name {{value}}
    - name: old_name
      type: string
      description: Current name of the worksheet
      required: false
      argument_format: --old_name {{value}}
    - name: open_after_export
      type: boolean
      description: Whether to open the PDF after export, default is False
      required: false
      argument_format: --open_after_export {{value}}
    - name: position
      type: integer
      description: New position index (0-based) for the worksheet
      required: false
      argument_format: --position {{value}}
    - name: range_str
      type: string
      description: Range to highlight, in the format of 'A1:B10'
      required: false
      argument_format: --range_str {{value}}
    - name: row_fields
      type: array
      description: List of fields to use as row labels (e.g. ['A', 'B', 'C'])
      required: false
      argument_format: --row_fields "{{value}}"
    - name: rows
      type: integer
      description: Number of rows to freeze from the top
      required: false
      argument_format: --rows {{value}}
    - name: sheet_name
      type: string
      description: Name of the sheet to switch to or create
      required: false
      argument_format: --sheet_name {{value}}
    - name: sheets
      type: array
      description: List of sheet names to include in PDF, default is all sheets
      required: false
      argument_format: --sheets "{{value}}"
    - name: source_range
      type: string
      description: Range to transpose, in the format of 'A1:B10'
      required: false
      argument_format: --source_range {{value}}
    - name: source_sheet
      type: string
      description: Name of the source sheet containing the data
      required: false
      argument_format: --source_sheet {{value}}
    - name: start_index
      type: integer
      description: The index of the first row to write to, default is 2 (skip the first row)
      required: false
      argument_format: --start_index {{value}}
    - name: table_name
      type: string
      description: Name for the new pivot table
      required: false
      argument_format: --table_name {{value}}
    - name: target_cell
      type: string
      description: Target cell to paste the transposed data, in the format of 'A1'
      required: false
      argument_format: --target_cell {{value}}
    - name: title
      type: string
      description: Title for the chart
      required: false
      argument_format: --title {{value}}
    - name: value
      type: string
      description: The value to hide rows for, default is 'N/A'
      required: false
      argument_format: --value {{value}}
    - name: value_fields
      type: array
      description: List of fields to use as values (e.g. ['A', 'B', 'C'])
      required: false
      argument_format: --value_fields "{{value}}"
    - name: width
      type: number
      description: Width to set (in characters)
      required: false
      argument_format: --width {{value}}
    - name: x_axis_title
      type: string
      description: Title for the X axis
      required: false
      argument_format: --x_axis_title {{value}}
    - name: y_axis_title
      type: string
      description: Title for the Y axis
      required: false
      argument_format: --y_axis_title {{value}}
    - name: zoom_percentage
      type: integer
      description: Zoom level as a percentage (e.g., 75 for 75%, 100 for normal size, 150 for zoomed in). Valid range is typically
        10-400.
      required: false
      argument_format: --zoom_percentage {{value}}
    meta:
      related_app: libreoffice_calc
