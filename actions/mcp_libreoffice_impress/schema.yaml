actions:
  libreoffice_impress:
    signature: libreoffice_impress <action> [<alignment>] [<append>] [<apply>] [<autoplay>] [<bold>] [<box_index>] [<color>]
      [<content>] [<enabled>] [<file_path>] [<font_name>] [<format>] [<height>] [<image_path>] [<interval_minutes>] [<italic>]
      [<line_numbers>] [<orientation>] [<overwrite>] [<page_index>] [<page_indices>] [<position>] [<size>] [<slide_index>]
      [<target_position>] [<underline>] [<width>]
    docstring: |-
      Entry point for LibreOffice Impress MCP tools. Choose a sub-action and supply its parameters.

      Available actions:
      - configure_auto_save: Enables or disables auto-save functionality for the current document and sets the auto-save interval. (required: enabled, interval_minutes)
      - delete_content: Deletes the specified textbox from a slide. (required: slide_index, box_index)
      - duplicate_slide: Creates a duplicate of a specific slide and places it after a given position in the presentation. (required: slide_index, target_position)
      - env_info: Get the content of the specified pages. If no page indices are provided, returns the content of all pages. It should be called first to obtain the information before other tools that depend on the results are invoked. (optional: page_indices)
      - export_to_image: Exports the current presentation or a specific slide to an image file format (PNG, JPEG, etc.). (required: file_path, format; optional: slide_index)
      - get_slide_count: Gets the total number of slides in the current presentation.
      - go_to_slide: Navigates to a specific slide in the presentation based on its index. (required: slide_index)
      - insert_file: Inserts a video or audio file into the current or specified slide in the presentation. (required: file_path; optional: slide_index, position, size, autoplay)
      - insert_image: Inserts an image to a specific slide in the presentation. (required: slide_index, image_path; optional: width, height, position)
      - position_box: Positions a textbox or image on a slide at a specific location or predefined position. (required: slide_index, box_index, position)
      - save: Save the current presentation to its current location
      - save_as: Saves the current document to a specified location with a given filename. (required: file_path; optional: overwrite)
      - set_background_color: Sets the background color for the specified textbox on a slide. (required: slide_index, box_index, color)
      - set_slide_background: Sets the background color or image for a specific slide or all slides. (optional: slide_index, color, image_path)
      - set_slide_font: Sets the font style for all text elements in a specific slide. (required: slide_index, font_name)
      - set_slide_orientation: Changes the orientation of slides in the presentation between portrait (upright) and landscape (sideways). (required: orientation)
      - set_style: Sets the style properties for the specified textbox on a slide. (required: slide_index, box_index; optional: bold, italic, underline)
      - set_text_color: Sets the text color for the specified textbox on a slide. (required: slide_index, box_index, color)
      - set_text_strikethrough: Applies or removes strike-through formatting to specific text content in a slide. (required: slide_index, box_index, line_numbers, apply)
      - set_textbox_alignment: Sets the text alignment for the specified textbox on a slide. (required: slide_index, box_index, alignment)
      - write_text: writes text to a specific textbox on a slide (required: content, page_index, box_index; optional: bold, italic, size, append)
    arguments:
    - name: action
      type: string
      description: 'Sub-action to run. Allowed options: configure_auto_save, delete_content, duplicate_slide, env_info, export_to_image,
        get_slide_count, go_to_slide, insert_file, insert_image, position_box, save, save_as, set_background_color, set_slide_background,
        set_slide_font, set_slide_orientation, set_style, set_text_color, set_text_strikethrough, set_textbox_alignment, write_text.'
      required: true
      enum:
      - configure_auto_save
      - delete_content
      - duplicate_slide
      - env_info
      - export_to_image
      - get_slide_count
      - go_to_slide
      - insert_file
      - insert_image
      - position_box
      - save
      - save_as
      - set_background_color
      - set_slide_background
      - set_slide_font
      - set_slide_orientation
      - set_style
      - set_text_color
      - set_text_strikethrough
      - set_textbox_alignment
      - write_text
    - name: alignment
      type: string
      description: The text alignment to apply to the title
      required: false
      argument_format: --alignment {{value}}
      enum:
      - left
      - center
      - right
      - justify
    - name: append
      type: boolean
      description: Whether to append the text, default is False. If you want to observe some formats(like a bullet at the
        beginning) or keep the original text, you should set up it.
      required: false
      argument_format: --append {{value}}
    - name: apply
      type: boolean
      description: Whether to apply (true) or remove (false) strike-through formatting
      required: false
      argument_format: --apply {{value}}
    - name: autoplay
      type: boolean
      description: Whether the video or audio should automatically play when the slide is shown
      required: false
      argument_format: --autoplay {{value}}
    - name: bold
      type: boolean
      description: Whether to make the text bold, default is false
      required: false
      argument_format: --bold {{value}}
    - name: box_index
      type: integer
      description: The index of the textbox to modify (0-based indexing)
      required: false
      argument_format: --box_index {{value}}
    - name: color
      type: string
      description: The color to apply to the textbox (e.g., 'red', 'green', 'blue', 'yellow', or hex color code)
      required: false
      argument_format: --color {{value}}
    - name: content
      type: string
      description: The text content of the note to add
      required: false
      argument_format: --content {{value}}
    - name: enabled
      type: boolean
      description: Whether to enable (true) or disable (false) auto-save
      required: false
      argument_format: --enabled {{value}}
    - name: file_path
      type: string
      description: The full path to the file to be inserted
      required: false
      argument_format: --file_path {{value}}
    - name: font_name
      type: string
      description: The name of the font to apply (e.g., 'Arial', 'Times New Roman', 'Calibri')
      required: false
      argument_format: --font_name {{value}}
    - name: format
      type: string
      description: The image format to export to (e.g., 'png', 'jpeg', 'gif')
      required: false
      argument_format: --format {{value}}
      enum:
      - png
      - jpeg
      - jpg
      - gif
      - bmp
      - tiff
    - name: height
      type: number
      description: The height of the image in centimeters
      required: false
      argument_format: --height {{value}}
    - name: image_path
      type: string
      description: Path to an image file to use as background. If provided, overrides color.
      required: false
      argument_format: --image_path {{value}}
    - name: interval_minutes
      type: number
      description: The interval in minutes between auto-saves (minimum 1 minute)
      required: false
      argument_format: --interval_minutes {{value}}
    - name: italic
      type: boolean
      description: Whether to make the text italic, default is false
      required: false
      argument_format: --italic {{value}}
    - name: line_numbers
      type: array
      description: The line numbers to apply strike-through formatting to (1-based indexing)
      required: false
      argument_format: --line_numbers "{{value}}"
      items:
        type: integer
    - name: orientation
      type: string
      description: The desired orientation for the slides
      required: false
      argument_format: --orientation {{value}}
      enum:
      - portrait
      - landscape
    - name: overwrite
      type: boolean
      description: 'Whether to overwrite the file if it already exists (default: false)'
      required: false
      argument_format: --overwrite {{value}}
    - name: page_index
      type: integer
      description: The index of the slide to add a note to (1-based indexing)
      required: false
      argument_format: --page_index {{value}}
    - name: page_indices
      type: array
      description: List of page indices to retrieve. If null or omitted, all pages are returned.
      required: false
      argument_format: --page_indices "{{value}}"
      items:
        type: integer
        description: Page index (starting from 0 or 1 depending on context).
    - name: position
      type: string
      description: Predefined position on the slide (left, right, center, top, bottom)
      required: false
      argument_format: --position {{value}}
      enum:
      - left
      - right
      - center
      - top
      - bottom
      - top-left
      - top-right
      - bottom-left
      - bottom-right
    - name: size
      type: integer
      description: The size of the text. If None, uses the box's current font size.
      required: false
      argument_format: --size {{value}}
    - name: slide_index
      type: integer
      description: The index of the slide to navigate to (1-based indexing)
      required: false
      argument_format: --slide_index {{value}}
    - name: target_position
      type: integer
      description: The position (1-based index) after which the duplicated slide will be placed
      required: false
      argument_format: --target_position {{value}}
    - name: underline
      type: boolean
      description: Whether to underline the title text
      required: false
      argument_format: --underline {{value}}
    - name: width
      type: number
      description: The width of the image in centimeters
      required: false
      argument_format: --width {{value}}
    meta:
      related_app: libreoffice_impress
